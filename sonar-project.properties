# SonarQube Cloud analysis of TypeScript / JavaScript / Kotlin (.github/workflows/sonar.yml, docs/TESTING.md §10);
# the organization and the project key (<org>_seqcall) come from the workflow. The C# sidecar is a separate project
# (<org>_seqcall-csharp) analysed by the SonarScanner for .NET.
sonar.projectName=Seqcall
sonar.sources=packages,scripts
sonar.tests=packages,scripts
sonar.test.inclusions=**/test/**,**/tests/**
sonar.exclusions=packages/csharp/**,**/test/**,**/tests/**,**/node_modules/**,**/dist/**,**/build/**
# only our own projects: .vscode-test/ holds whole VS Code builds with their own tsconfigs
sonar.typescript.tsconfigPaths=packages/*/tsconfig.json
sonar.javascript.node.maxspace=2048
# TS/JS coverage from `npm run coverage` and `npm run coverage:vscode` (absent: no coverage shown, the scan still runs)
sonar.javascript.lcov.reportPaths=coverage/ts/lcov.info,coverage/vscode/lcov.info
# Kotlin (Rider plugin) coverage from `npm run coverage:kt` (Kover, JaCoCo XML)
sonar.coverage.jacoco.xmlReportPaths=coverage/kotlin/report.xml
# S4036 (a program started by name, found through PATH): accepted by design. Seqcall and its scripts are developer
# tools that start git / node / npm / dotnet from the user's PATH. An issue accepted on the server
# opens again as new when its code moves, so the reason lives here.
sonar.issue.ignore.multicriteria=path1,path2
sonar.issue.ignore.multicriteria.path1.ruleKey=javascript:S4036
sonar.issue.ignore.multicriteria.path1.resourceKey=**/*
sonar.issue.ignore.multicriteria.path2.ruleKey=typescript:S4036
sonar.issue.ignore.multicriteria.path2.resourceKey=**/*
